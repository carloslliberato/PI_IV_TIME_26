<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define idioma, escala responsiva e título da tela de relatórios. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arboriza | Relatórios</title>

  <!-- Carrega ícones, estilos compartilhados e estilos próprios desta tela. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles-profissional.css" data-professional-sidebar-styles="true">
  <link rel="stylesheet" href="relatorio.css">
</head>
<body>
  <div class="app-shell">
    <!-- O sidebar valida o acesso e carrega o script específico desta tela. -->
    <div id="sidebar-profissional" data-script="relatorio.js"></div>

    <main class="main professional-main">
      <section class="professional-content reports-page" aria-labelledby="reportsPageTitle">
        <!-- Apresenta a finalidade do painel e o município dos registros. -->
        <header class="reports-heading">
          <div>
            <span class="professional-eyebrow">GESTÃO MUNICIPAL</span>
            <h1 id="reportsPageTitle">Relatórios</h1>
            <p>Consulte indicadores de árvores, ocorrências e ordens de serviço.</p>
          </div>
          <span class="reports-municipality"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i><span id="reportsMunicipality">Carregando município...</span></span>
        </header>

        <!-- Permite escolher o assunto do relatório e como os registros serão agrupados. -->
        <section class="reports-navigation" aria-label="Navegação dos relatórios">
          <nav class="report-subject-tabs" role="tablist" aria-label="Assunto do relatório">
            <button class="report-tab is-active" id="subjectTabTrees" type="button" role="tab" aria-selected="true" data-report-subject="trees">Árvores</button>
            <button class="report-tab" id="subjectTabOccurrences" type="button" role="tab" aria-selected="false" data-report-subject="occurrences">Ocorrências</button>
            <button class="report-tab" id="subjectTabOrders" type="button" role="tab" aria-selected="false" data-report-subject="orders">Ordens de serviço</button>
            <button class="report-tab" id="subjectTabTeams" type="button" role="tab" aria-selected="false" data-report-subject="teams">Equipes</button>
          </nav>
          <div class="report-grouping-row">
            <div class="report-grouping-area">
              <span class="report-grouping-label">Agrupar por</span>
              <nav class="report-group-tabs" id="reportGroupingTabs" role="tablist" aria-label="Agrupamento do relatório"></nav>
            </div>
            <label class="report-team-filter" id="reportTeamFilter" for="reportTeamSelect" hidden>
              <span>Equipe</span>
              <select id="reportTeamSelect"><option value="">Todas as equipes</option></select>
            </label>
            <button class="reports-export" id="exportReport" type="button">
              <i class="bi bi-download" aria-hidden="true"></i>
              <span>Exportar CSV</span>
            </button>
          </div>
        </section>

        <!-- Resume o relatório selecionado e apresenta contagem e distribuição visual. -->
        <section class="reports-card" aria-labelledby="reportTitle">
          <header class="reports-card-heading">
            <div>
              <h2 id="reportTitle">Carregando relatório...</h2>
              <p id="reportDescription" aria-live="polite"></p>
            </div>
            <span class="reports-total"><strong id="reportTotal">—</strong><span id="reportTotalLabel">registros</span></span>
          </header>

          <!-- As barras são desenhadas no navegador a partir das contagens agrupadas. -->
          <div class="reports-chart" id="reportChart" role="img" aria-label="Gráfico de distribuição do relatório"></div>

          <!-- Mantém os mesmos dados em formato tabular para leitura e acessibilidade. -->
          <div class="reports-table-wrap">
            <table class="reports-table">
              <thead><tr><th id="reportGroupColumn" scope="col">Grupo</th><th scope="col">Quantidade</th><th scope="col">Participação</th></tr></thead>
              <tbody id="reportTableBody"></tbody>
            </table>
          </div>
        </section>

        <!-- Informa a área dos dados de demonstração enquanto a API ainda não estiver conectada. -->
        <p class="reports-source-note"><i class="bi bi-info-circle" aria-hidden="true"></i> Os números desta visualização são fictícios.</p>
      </section>
    </main>
  </div>

  <!-- O sidebar injeta relatorio.js depois de validar login e setor. -->
  <script src="sidebar-profissional.js"></script>
</body>
</html>
